# Gradle settings for CI only. The e2e job copies this file to
# ~/.gradle/gradle.properties, which overrides android/gradle.properties
# (that one gives Gradle 8 GB for dev machines; the runner has ~8 GB in total,
# shared with the Android emulator and the Firestore emulator).
# Same approach as android/nowinandroid's .github/ci-gradle.properties.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.workers.max=2
kotlin.incremental=false
