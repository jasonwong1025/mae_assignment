name: CI

# Quality gate for every change to main. Enforces the team guidelines:
# the pinned Flutter SDK, formatting, very_good_analysis (infos are fatal),
# the Dart test suite, up-to-date generated code, the Firestore rules tests,
# and the Patrol end-to-end journey on an Android emulator. Deployment is
# intentionally out of scope for now.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a branch cancels the previous run, except on main where
# every commit is checked to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flutter:
    name: Format, analyze & test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Reads the exact Flutter version from .fvmrc, so CI matches what the
      # team runs through FVM. No channel drift.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Fail fast if a Firestore path is built outside FirestoreRefs
      # (lib/core/firebase/firestore_refs.dart).
      - name: Check Firestore paths are centralized
        run: dart run tool/check_firestore_paths.dart
      # Layering and model rules: UI never imports Firebase or services,
      # models and state are Freezed, errors extend AppException.
      - name: Check architecture rules
        run: dart run tool/check_architecture.dart

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool patrol_test

      # `dart analyze` (not `flutter analyze`) so the riverpod_lint analyzer
      # plugin from analysis_options.yaml runs too.
      - name: Analyze (infos are fatal)
        run: dart analyze --fatal-infos

      # Regenerate Freezed/build_runner output and fail if it differs from
      # what was committed, so generated code can never go stale. Checks both
      # modified tracked files and any new, uncommitted generated files.
      - name: Verify generated code is up to date
        run: |
          dart run build_runner build
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is out of date. Run 'dart run build_runner build' and commit the result."
            git --no-pager status --short
            git --no-pager diff
            exit 1
          fi

      - name: Run unit and widget tests
        run: flutter test

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: test_firebase
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The Firestore emulator runs on the JVM.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test_firebase/package-lock.json

      - name: Install dependencies
        run: npm ci

      # emulators:exec starts the Firestore emulator, runs vitest, then shuts
      # it down. No device needed.
      - name: Run security rules tests
        run: npm test

  functions:
    name: Functions build and emulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            test_firebase/package-lock.json
      - run: npm ci --prefix functions
      - run: npm ci --prefix test_firebase
      - run: npm run lint --prefix functions
      - run: npm run build --prefix functions
      - run: npm run test:functions --prefix test_firebase

  e2e:
    name: E2E (Patrol on Android emulator)
    # About 15-20 minutes, so it runs on pushes to main and on demand
    # (Actions tab > CI > Run workflow), not on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The runner starts with ~5 GB free; the emulator alone needs ~7 GB.
      # Keep the Android SDK and the swap file (the job needs both).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false
          large-packages: false
          swap-storage: false

      # From the android-emulator-runner README: lets the runner user use
      # /dev/kvm, so the emulator is hardware accelerated.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      # Gradle and the Firestore emulator both run on the JVM.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (build cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test_firebase/package-lock.json

      # The Firebase CLI downloads the emulator binaries on first use and
      # suggests caching this path on CI.
      - name: Cache Firebase emulators
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('test_firebase/package-lock.json') }}

      - name: Install dependencies
        run: |
          flutter pub get --enforce-lockfile
          npm ci --prefix test_firebase
          npm ci --prefix functions
          npm run build --prefix functions

      # Pinned to match the patrol package (Patrol compatibility table).
      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.8.0
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"

      # android-emulator-runner installs the system image, creates and boots
      # the AVD, runs the script, then shuts the emulator down. Inside it,
      # firebase emulators:exec starts Auth + Firestore, seeds them, runs
      # Patrol, and stops them. The script must stay on one line (the action
      # runs each line separately).
      - name: Run end-to-end tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6000M
          emulator-boot-timeout: 900
          working-directory: test_firebase
          script: npx firebase emulators:exec --only auth,firestore,functions,storage --project mae-assignment-grocerly "FIRESTORE_EMULATOR_HOST=localhost:8085 FIREBASE_AUTH_EMULATOR_HOST=localhost:9099 node seed.mjs --with-customer && cd .. && patrol test --dart-define=USE_FIREBASE_EMULATOR=true"

      - name: Upload test reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-reports
          path: build/app/reports/androidTests/
          if-no-files-found: ignore
