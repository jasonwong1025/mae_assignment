name: CI

# Quality gate for every change to main. Enforces the team guidelines:
# the pinned Flutter SDK, formatting, very_good_analysis (infos are fatal),
# the Dart test suite, up-to-date generated code, the Firestore rules tests,
# and the Patrol end-to-end journey on an Android emulator. Deployment is
# intentionally out of scope for now.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a branch cancels the previous run, except on main where
# every commit is checked to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flutter:
    name: Format, analyze & test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Reads the exact Flutter version from .fvmrc, so CI matches what the
      # team runs through FVM. No channel drift.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Fail fast if a Firestore path is hard-coded instead of using the
      # constants in lib/core/firebase/firestore_paths.dart.
      - name: Check Firestore paths are centralized
        run: dart run tool/check_firestore_paths.dart

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (infos are fatal)
        run: flutter analyze --fatal-infos

      # Regenerate Freezed/build_runner output and fail if it differs from
      # what was committed, so generated code can never go stale. Checks both
      # modified tracked files and any new, uncommitted generated files.
      - name: Verify generated code is up to date
        run: |
          dart run build_runner build
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is out of date. Run 'dart run build_runner build' and commit the result."
            git --no-pager status --short
            git --no-pager diff
            exit 1
          fi

      - name: Run unit and widget tests
        run: flutter test

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: test_firebase
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The Firestore emulator runs on the JVM.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test_firebase/package-lock.json

      - name: Install dependencies
        run: npm ci

      # emulators:exec starts the Firestore emulator, runs vitest, then shuts
      # it down. No device needed.
      - name: Run security rules tests
        run: npm test

  e2e:
    name: E2E (Patrol on Android emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Linux runners expose /dev/kvm, but only to root. This udev rule opens
      # it to the runner user so the emulator gets hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Gradle and the Firestore emulator both run on the JVM.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test_firebase/package-lock.json

      - name: Install dependencies
        run: |
          flutter pub get --enforce-lockfile
          npm ci --prefix test_firebase

      # Pinned to match the patrol package (see the Patrol compatibility
      # table referenced in the README).
      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.8.0
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"

      # emulators:exec starts Auth + Firestore, seeds them, runs the Patrol
      # flow, and shuts the emulators down. tool/run_e2e.dart installs the
      # Android system image, creates and boots the AVD, and runs Patrol.
      - name: Run end-to-end tests
        working-directory: test_firebase
        run: |
          npx firebase emulators:exec --only auth,firestore \
            --project mae-assignment-grocerly \
            "FIRESTORE_EMULATOR_HOST=localhost:8085 FIREBASE_AUTH_EMULATOR_HOST=localhost:9099 node seed.mjs --with-customer && cd .. && dart run tool/run_e2e.dart"

      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            build/e2e/patrol.log
            build/app/reports/androidTests/
          if-no-files-found: ignore
