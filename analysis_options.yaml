# Static analysis configuration.
#
# Baseline: very_good_analysis, the strict rule set used at Very Good Ventures.
# We adopt it for a strong, shared quality bar across the team, with the few
# deliberate exceptions documented below.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    # Node project for the Firestore rules tests; its node_modules ships
    # stray Dart template files that are not ours to analyze.
    - test_firebase/**
    # Generated code (Freezed / json_serializable) is not ours to lint.
    - "**/*.freezed.dart"
    - "**/*.g.dart"

linter:
  rules:
    # public_member_api_docs is designed for published packages, where every
    # public API needs a doc comment. Grocerly is an application, not a
    # package, so requiring a comment on every widget, enum value and
    # constructor adds noise that restates the code rather than explaining it.
    # We document where it earns its keep (non-obvious behaviour, invariants)
    # instead.
    public_member_api_docs: false

    # specify_nonobvious_property_types fights Dart's type inference, which we
    # rely on for Riverpod provider declarations (e.g.
    # StreamNotifierProvider.autoDispose.family(...)), where spelling out the
    # generic type is long and non-idiomatic.
    specify_nonobvious_property_types: false

    # sort_pub_dependencies demands strict A-Z across every pubspec entry,
    # which conflicts with the universal convention of keeping the `flutter`
    # SDK dependency first. We keep the package entries sorted by hand.
    sort_pub_dependencies: false
